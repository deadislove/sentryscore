$kind: http-request
description: |
  Scores one transaction and returns a fraud probability plus a
  PASS/BLOCK decision against a fixed threshold. The threshold
  (`BLOCK_THRESHOLD = 0.2891` in `main.py`) is the F1-optimal cutoff
  on this model's own validation split — a real derivation, but a
  statistical one, not a cost-calibrated business decision. See
  `docs/business-domain-knowhow/README.md` for that distinction.
url: "{{baseUrl}}/predict"
method: POST
headers:
